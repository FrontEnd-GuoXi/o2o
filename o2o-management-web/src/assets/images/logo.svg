<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF"/>
      <stop offset="100%" style="stop-color:#2D6CDF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67C23A"/>
      <stop offset="100%" style="stop-color:#409EFF"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>

  <!-- 装饰圆环 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- 左侧：O（Online） -->
  <circle cx="180" cy="256" r="58" fill="none" stroke="#fff" stroke-width="10"/>

  <!-- 中间：连接箭头 -->
  <g stroke="url(#ring)" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="240" y1="256" x2="280" y2="256"/>
    <polyline points="270,246 280,256 270,266" fill="none"/>
  </g>

  <!-- 右侧：O（Offline） -->
  <circle cx="340" cy="256" r="58" fill="none" stroke="#fff" stroke-width="10"/>

  <!-- 左侧 O 中间填充 -->
  <circle cx="180" cy="256" r="20" fill="#fff" opacity="0.3"/>
  <!-- 右侧 O 中间填充 -->
  <circle cx="340" cy="256" r="20" fill="#fff" opacity="0.3"/>
</svg>